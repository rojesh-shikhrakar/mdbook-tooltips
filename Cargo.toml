[package]
name = "mdbook-tooltips"
version = "0.1.0"
edition = "2021"

description = "mdBook preprocessor to add tooltips features to your book"
repository = "https://github.com/rojesh-shikhrakar/mdbook-tooltips"
license = "MIT"
homepage = "https://github.com/rojesh-shikhrakar/mdbook-tooltips"

[dependencies]
clap = { version = "4.5.51", features = ["derive"] }
cucumber = "0.21.1"
regex = "1.12.2"
mdbook = "0.4"
serde_json = "1.0"
toml = "0.8"
atty = "0.2"
once_cell = "1.21"

[dev-dependencies]
futures = "0.3"

## Removed custom [[test]] section so Rust's default test harness runs the cucumber integration test in `tests/`.
